---
# Caller workflow for changelog fragment enforcement.
# Consumes reusable workflow from ansible/actions (PR #167).
# Jira: AAP-97534
name: "API: Changelog Fragment Enforcement"

on:
  pull_request:
    branches:
      - main
      - stable-*
      - release-*
      - AAP-97534-*
    paths:
      - 'api/openapi.yaml'
      - 'changelogs/fragments/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    # djyasin/actions for test; production: ansible/actions@<tag>
    uses: djyasin/actions/.github/workflows/openapi-changelog-fragment.yml@feat/changelog-fragment-enforcement # PR #167
    with:
      spec-paths: "api/openapi.yaml"
      fragment-dir: "changelogs/fragments"
